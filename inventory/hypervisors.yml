---
# Hypervisor inventory for VM-based Octant deployment
# Copy to hypervisors.yml and adjust for your environment
all:
  children:
    hypervisors:
      hosts:
        my-hypervisor:
          ansible_host: 10.216.113.177    # Your hypervisor IP (or use localhost)
          ansible_connection: local    # Uncomment if running on the hypervisor itself
          libvirt_images_path: /var/lib/libvirt/images
          data_disk_pool_path: /var/lib/libvirt/images
          libvirt_network: default
          base_image_name: octant-base
          # Hashi agent join config (used by 11-join-hypervisor.yml)
          region: home
          server: false
          # Libvirt bridge IP — used as bind/advertise addr so agents
          # communicate with VMs on the same subnet (avoids cross-subnet gossip issues)
          libvirt_bridge_ip: 192.168.122.1
          # Path to nomad-device-amdgpu checkout on the hypervisor.
          # The binary must be pre-built (make build or make build-sysfs) before
          # running make join-hypervisor.
          amdgpu_plugin_repo_dir: /home/melliott/git/nomad-device-amdgpu
