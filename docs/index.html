<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Octant Lab</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: #f5f5f5;
    }
    p {
      font-size: 1.1rem;
      color: #a0a0b0;
      margin-bottom: 2rem;
    }
    a {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #2d6cdf;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1rem;
      transition: background 0.2s;
    }
    a:hover { background: #1b4fa0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Octant Lab</h1>
    <p>Home lab infrastructure</p>
    <a href="/docs/">Documentation</a>
  </div>
</body>
</html>
