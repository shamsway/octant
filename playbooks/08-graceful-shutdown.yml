---
# Graceful Cluster Shutdown
# Stops all services and daemons in dependency order, then shuts down VMs
#
# Usage:
#   make shutdown
#   make shutdown ARGS="-e confirm_shutdown=yes"    # Skip confirmation prompt
#
# This playbook is idempotent - safe to re-run if interrupted. If services
# are already stopped or APIs are unreachable, those phases are skipped.
#
# Phases:
#   1. Terraform destroy all services (skipped if APIs unreachable)
#   2. Set Ceph OSD maintenance flags (noout, nobackfill, norecover)
#   3. Unmount CephFS on all nodes
#   4. Stop Nomad and Consul agents/servers
#   5. Stop HAProxy on the hypervisor
#   6. Shut down all VMs via virsh
#
# After shutdown, optionally run: make snapshot
#
# After restart, unset Ceph flags:
#   ssh octant-01 'sudo ceph osd unset noout && sudo ceph osd unset nobackfill && sudo ceph osd unset norecover'

- name: Graceful Shutdown - Destroy Services
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    cluster_address: "{{ hostvars[groups['servers'][0]].ansible_host | default(groups['servers'][0]) }}"
    confirm_shutdown: "no"
    shutdown_state_dir: "{{ playbook_dir }}/.shutdown-state"

  pre_tasks:
    - name: Check if Consul is accessible
      ansible.builtin.uri:
        url: "http://{{ cluster_address }}:8500/v1/status/leader"
        return_content: true
        timeout: 5
      register: consul_leader
      failed_when: false

    - name: Check if Nomad is accessible
      ansible.builtin.uri:
        url: "http://{{ cluster_address }}:4646/v1/status/leader"
        return_content: true
        timeout: 5
      register: nomad_leader
      failed_when: false

    - name: Set cluster API availability
      ansible.builtin.set_fact:
        cluster_apis_up: "{{ (consul_leader.status | default(-1) == 200) and (nomad_leader.status | default(-1) == 200) }}"

    - name: Get running Nomad jobs
      ansible.builtin.uri:
        url: "http://{{ cluster_address }}:4646/v1/jobs"
        return_content: true
      register: nomad_jobs
      when: cluster_apis_up

    - name: Get Consul services
      ansible.builtin.uri:
        url: "http://{{ cluster_address }}:8500/v1/catalog/services"
        return_content: true
      register: consul_services
      when: cluster_apis_up

    - name: Build running jobs list
      ansible.builtin.set_fact:
        running_jobs: "{{ nomad_jobs.json | selectattr('Status', 'equalto', 'running') | map(attribute='Name') | list }}"
      when: cluster_apis_up

    - name: Display shutdown warning
      ansible.builtin.debug:
        msg: >-
          GRACEFUL CLUSTER SHUTDOWN --
          Terraform destroy {{ running_jobs | length }} services,
          set Ceph OSD flags, unmount CephFS, stop Nomad/Consul,
          stop HAProxy, shut down VMs.
          Consul services: {{ consul_services.json | length }}.
          Running jobs: {{ running_jobs | join(', ') }}
      when: cluster_apis_up

    - name: Display partial shutdown notice
      ansible.builtin.debug:
        msg: >-
          GRACEFUL CLUSTER SHUTDOWN --
          Consul/Nomad APIs are not reachable.
          Skipping terraform destroy and state capture.
          Proceeding with Ceph flags, CephFS unmount,
          stop Nomad/Consul, stop HAProxy, shut down VMs.
      when: not cluster_apis_up

    - name: Confirm shutdown
      ansible.builtin.pause:
        prompt: "Type 'yes' to confirm graceful shutdown"
      register: confirm_prompt
      when: confirm_shutdown != "yes"

    - name: Validate confirmation
      ansible.builtin.fail:
        msg: "Shutdown cancelled. User did not confirm."
      when:
        - confirm_shutdown != "yes"
        - confirm_prompt.user_input != "yes"

    - name: Create shutdown state directory
      ansible.builtin.file:
        path: "{{ shutdown_state_dir }}"
        state: directory
        mode: '0700'
      when: cluster_apis_up

    - name: Save pre-shutdown state
      ansible.builtin.copy:
        content: |
          # Octant cluster shutdown state
          # Generated by 08-graceful-shutdown.yml
          timestamp: "{{ ansible_date_time.iso8601 }}"
          running_jobs: {{ running_jobs | to_nice_yaml | indent(2) }}
          consul_services: {{ consul_services.json.keys() | list | to_nice_yaml | indent(2) }}
        dest: "{{ shutdown_state_dir }}/shutdown-state.yml"
        mode: '0600'
      when: cluster_apis_up

  roles:
    - role: apply-terraform
      vars:
        terraform_action: destroy
        modules: "{{ terraform_execution_order | reverse | list }}"
      when: cluster_apis_up

- name: Graceful Shutdown - Stop Cluster Services
  hosts: servers
  user: "{{ admin_user }}"
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0

  tasks:
    - name: Check host connectivity
      ansible.builtin.wait_for_connection:
        timeout: 10
      register: host_connection
      failed_when: false

    - name: Skip unreachable host
      ansible.builtin.debug:
        msg: "Host {{ inventory_hostname }} is unreachable, skipping"
      when: host_connection is failed

    - name: Shutdown node services
      when: host_connection is not failed
      block:
        # ==================================================================
        # PHASE: Ceph maintenance flags (first node only)
        # ==================================================================

        - name: Set Ceph OSD maintenance flags
          when: inventory_hostname == groups['servers'][0]
          block:
            - name: Set noout flag
              ansible.builtin.command: ceph osd set noout
              changed_when: true
              failed_when: false

            - name: Set nobackfill flag
              ansible.builtin.command: ceph osd set nobackfill
              changed_when: true
              failed_when: false

            - name: Set norecover flag
              ansible.builtin.command: ceph osd set norecover
              changed_when: true
              failed_when: false

            - name: Verify OSD flags are set
              ansible.builtin.command: ceph osd dump
              register: osd_dump
              changed_when: false
              failed_when: false

            - name: Display OSD flags
              ansible.builtin.debug:
                msg: "Ceph OSD flags: {{ osd_dump.stdout_lines | select('search', 'flags') | first | default('unable to parse flags') }}"
              when: osd_dump.rc | default(1) == 0

        # ==================================================================
        # PHASE: Unmount CephFS
        # ==================================================================

        - name: Check if CephFS is mounted
          ansible.builtin.command: mountpoint -q /mnt/services
          register: cephfs_mounted
          changed_when: false
          failed_when: false

        - name: Unmount CephFS
          ansible.builtin.command: umount /mnt/services
          when: cephfs_mounted.rc == 0
          changed_when: true

        - name: Verify CephFS is unmounted
          ansible.builtin.command: mountpoint -q /mnt/services
          register: cephfs_verify
          changed_when: false
          failed_when: false

        # ==================================================================
        # PHASE: Stop Nomad
        # ==================================================================

        - name: Stop nomad-agent
          ansible.builtin.service:
            name: nomad-agent
            state: stopped
          failed_when: false

        - name: Stop nomad-agent-root
          ansible.builtin.service:
            name: nomad-agent-root
            state: stopped
          failed_when: false

        - name: Stop nomad-server
          ansible.builtin.service:
            name: nomad-server
            state: stopped
          failed_when: false

        # ==================================================================
        # PHASE: Stop Consul
        # ==================================================================

        - name: Stop consul-agent
          ansible.builtin.service:
            name: consul-agent
            state: stopped
          failed_when: false

        - name: Stop consul-agent-root
          ansible.builtin.service:
            name: consul-agent-root
            state: stopped
          failed_when: false

        - name: Stop consul-server
          ansible.builtin.service:
            name: consul-server
            state: stopped
          failed_when: false

        - name: Node shutdown complete
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: Nomad stopped, Consul stopped,
              CephFS {{ 'unmounted' if cephfs_verify.rc | default(1) != 0 else 'WARNING still mounted' }}

- name: Graceful Shutdown - Stop HAProxy Ingress
  hosts: hypervisors
  gather_facts: false
  become: true

  tasks:
    - name: Check if HAProxy is running
      ansible.builtin.systemd:
        name: haproxy
      register: haproxy_status
      check_mode: true
      changed_when: false

    - name: Stop HAProxy
      ansible.builtin.systemd:
        name: haproxy
        state: stopped
      when: haproxy_status.status.ActiveState | default('inactive') == 'active'

    - name: HAProxy status
      ansible.builtin.debug:
        msg: "HAProxy {{ 'stopped' if haproxy_status.status.ActiveState | default('inactive') == 'active' else 'was not running' }}"

- name: Graceful Shutdown - Shut Down VMs
  hosts: hypervisors
  gather_facts: false
  become: true

  vars:
    server_list: "{{ groups['servers'] | default([]) }}"

  tasks:
    - name: Get running VMs
      ansible.builtin.shell: virsh list --state-running --name
      register: running_vms_output
      changed_when: false

    - name: Set VMs to shut down
      ansible.builtin.set_fact:
        vms_to_shutdown: "{{ server_list | intersect(running_vms_output.stdout_lines) }}"

    - name: Shut down cluster VMs (graceful)
      ansible.builtin.command: virsh shutdown {{ item }}
      loop: "{{ vms_to_shutdown }}"
      changed_when: true

    - name: Wait for VMs to shut down (up to 120s)
      ansible.builtin.shell: virsh domstate {{ item }}
      loop: "{{ vms_to_shutdown }}"
      register: vm_graceful_state
      until: vm_graceful_state.stdout | trim == 'shut off'
      retries: 24
      delay: 5
      changed_when: false
      failed_when: false

    - name: Identify VMs that did not shut down gracefully
      ansible.builtin.set_fact:
        stuck_vms: >-
          {{ vm_graceful_state.results
             | default([])
             | selectattr('stdout', 'defined')
             | rejectattr('stdout', 'search', 'shut off')
             | map(attribute='item')
             | list }}

    - name: Force destroy stuck VMs
      ansible.builtin.command: virsh destroy {{ item }}
      loop: "{{ stuck_vms }}"
      changed_when: true
      when: stuck_vms | length > 0

    - name: Wait for destroyed VMs to be off (up to 30s)
      ansible.builtin.shell: virsh domstate {{ item }}
      loop: "{{ stuck_vms }}"
      register: vm_destroy_state
      until: vm_destroy_state.stdout | trim == 'shut off'
      retries: 6
      delay: 5
      changed_when: false
      when: stuck_vms | length > 0

    - name: VM shutdown warnings
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ stuck_vms | join(', ') }} did not shut down gracefully
          within 120s and were forcibly destroyed (virsh destroy).
          This may indicate D-state processes from stale CSI/RBD mounts.
      when: stuck_vms | length > 0

  post_tasks:
    - name: Display final shutdown summary
      ansible.builtin.debug:
        msg: >-
          SHUTDOWN COMPLETE --
          All services stopped, CephFS unmounted, Ceph OSD flags set
          (noout, nobackfill, norecover), HAProxy stopped,
          VMs shut down: {{ server_list | join(', ') }}{{ ' (forced: ' + stuck_vms | join(', ') + ')' if stuck_vms | default([]) | length > 0 else '' }}.
          To snapshot: make snapshot.
          After restart, unset Ceph flags:
          ssh octant-01 'sudo ceph osd unset noout &&
          sudo ceph osd unset nobackfill &&
          sudo ceph osd unset norecover'
