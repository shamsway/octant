---
# Provision Octant VMs
# Creates VMs from pre-built base image for each host in the servers group
#
# Usage:
#   ansible-playbook playbooks/01-provision-vms.yml \
#     -i inventory/hypervisors.yml -i inventory/groups.yml
#
# Prerequisites:
#   - Base image built with playbooks/00-build-base-image.yml
#   - inventory/groups.yml with server definitions (octant-01, octant-02, octant-03)
#   - inventory/hypervisors.yml with hypervisor connection details

- name: Provision Octant VMs
  hosts: hypervisors
  gather_facts: true
  become: true

  vars:
    libvirt_images_path: "{{ hostvars[inventory_hostname]['libvirt_images_path'] | default('/var/lib/libvirt/images') }}"
    base_image_name: "{{ hostvars[inventory_hostname]['base_image_name'] | default('octant-base') }}"
    base_image_path: "{{ libvirt_images_path }}/{{ base_image_name }}.qcow2"
    data_disk_pool_path: "{{ hostvars[inventory_hostname]['data_disk_pool_path'] | default(libvirt_images_path) }}"
    vm_network: "{{ hostvars[inventory_hostname]['libvirt_network'] | default('default') }}"
    server_list: "{{ groups['servers'] | default([]) }}"

  tasks:
    - name: Validate server list is not empty
      ansible.builtin.fail:
        msg: >
          No servers defined in inventory. Add hosts to the 'servers' group
          in inventory/groups.yml. See groups.yml.example for reference.
      when: server_list | length == 0

    - name: Validate base image exists
      ansible.builtin.stat:
        path: "{{ base_image_path }}"
      register: base_image_check

    - name: Fail if base image missing
      ansible.builtin.fail:
        msg: >
          Base image not found at {{ base_image_path }}.
          Run 'make build-base-image' or 'ansible-playbook playbooks/00-build-base-image.yml' first.
      when: not base_image_check.stat.exists

    - name: Display provisioning plan
      ansible.builtin.debug:
        msg: |
          === Octant VM Provisioning ===
          Servers: {{ server_list | join(', ') }}
          Base image: {{ base_image_path }}
          ==============================

    - name: Configure DHCP reservation for {{ vm_host }}
      when: hostvars[vm_host]['vm_mac'] is defined and hostvars[vm_host]['vm_ip'] is defined
      ansible.builtin.shell: |
        # Check if reservation already exists
        virsh net-dumpxml {{ vm_network }} | grep -q '{{ hostvars[vm_host]["vm_mac"] }}' && exit 0
        # Add DHCP host entry
        virsh net-update {{ vm_network }} add ip-dhcp-host \
          "<host mac='{{ hostvars[vm_host]["vm_mac"] }}' name='{{ vm_host }}' ip='{{ hostvars[vm_host]["vm_ip"] }}'/>" \
          --live --config
      register: dhcp_reservation
      changed_when: dhcp_reservation.rc == 0 and 'exit 0' not in (dhcp_reservation.stdout | default(''))
      loop: "{{ server_list }}"
      loop_control:
        loop_var: vm_host

    - name: Create storage for {{ vm_host }}
      ansible.builtin.include_role:
        name: vm_storage
      vars:
        vm_name: "{{ vm_host }}"
        vm_os_disk_size: "{{ hostvars[vm_host]['vm_os_disk_size'] | default('60G') }}"
        vm_create_data_disk: "{{ hostvars[vm_host]['vm_create_data_disk'] | default(true) }}"
        vm_data_disk_size: "{{ hostvars[vm_host]['vm_data_disk_size'] | default('100G') }}"
        vm_create_container_disk: "{{ hostvars[vm_host]['vm_create_container_disk'] | default(true) }}"
        vm_container_disk_size: "{{ hostvars[vm_host]['vm_container_disk_size'] | default('30G') }}"
        vm_container_disk_format: "{{ hostvars[vm_host]['vm_container_disk_format'] | default('raw') }}"
      loop: "{{ server_list }}"
      loop_control:
        loop_var: vm_host

    - name: Provision and start {{ vm_host }}
      ansible.builtin.include_role:
        name: vm_provision
      vars:
        vm_name: "{{ vm_host }}"
        vm_ram_gb: "{{ hostvars[vm_host]['vm_ram_gb'] | default(8) }}"
        vm_vcpus: "{{ hostvars[vm_host]['vm_vcpus'] | default(2) }}"
        vm_mac: "{{ hostvars[vm_host]['vm_mac'] | default(omit) }}"
        vm_create_data_disk: "{{ hostvars[vm_host]['vm_create_data_disk'] | default(true) }}"
        vm_data_disk_size: "{{ hostvars[vm_host]['vm_data_disk_size'] | default('100G') }}"
        vm_create_container_disk: "{{ hostvars[vm_host]['vm_create_container_disk'] | default(true) }}"
        vm_container_disk_format: "{{ hostvars[vm_host]['vm_container_disk_format'] | default('raw') }}"
        vm_group: servers
      loop: "{{ server_list }}"
      loop_control:
        loop_var: vm_host

    - name: Write provisioned VMs inventory
      ansible.builtin.copy:
        content: |
          ---
          # Auto-generated by 01-provision-vms.yml
          # Do not edit - will be overwritten on next provisioning run
          all:
            children:
              servers:
                vars:
                  ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
                  admin_password: {{ admin_password | default('changeme') }}
                hosts:
          {% for host in server_list %}
                  {{ host }}:
                    ansible_host: {{ vm_ip_map[host] | default('unknown') }}
                    ansible_user: {{ admin_user | default('admin') }}
                    server: {{ hostvars[host]['server'] | default(true) }}
                    dnsserver: {{ hostvars[host]['dnsserver'] | default(true) }}
                    region: {{ hostvars[host]['region'] | default('home') }}
          {% endfor %}
        dest: "{{ playbook_dir }}/../inventory/provisioned_vms.yml"
        mode: '0644'
      delegate_to: localhost
      become: false

    - name: Display provisioning results
      ansible.builtin.debug:
        msg: |
          === Octant VM Provisioning Complete ===
          {% for host in server_list %}
          {{ host }}: {{ vm_ip_map[host] | default('unknown') }}
          {% endfor %}
          Inventory written to: inventory/provisioned_vms.yml
          Next step: ansible-playbook octant.yml -i inventory/provisioned_vms.yml
          ========================================
