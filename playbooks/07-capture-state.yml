---
# Capture Octant Lab State
# Gathers cluster state (packages, services, Consul/Nomad/Ceph/jobs) and writes
# docs/state/lab-state.json plus a markdown summary.
#
# Usage:
#   ansible-playbook playbooks/07-capture-state.yml -i inventory/provisioned_vms.yml -i inventory/groups.yml
#   make capture-state
#
# Output:
#   docs/state/lab-state.json   — machine-readable snapshot
#   docs/state/lab-state.md     — human-readable summary (generated by scripts/state-to-markdown.py)

# ---------------------------------------------------------------------------
# Play 1: Gather cluster state from each server
# ---------------------------------------------------------------------------
- name: Gather cluster state
  hosts: servers
  gather_facts: true
  module_defaults:
    ansible.builtin.setup:
      gather_subset:
        - "!hardware"
  become: true

  vars:
    cluster_host: "{{ groups['servers'][0] }}"
    consul_url: "http://localhost:8500"
    nomad_url: "http://localhost:4646"
    tracked_packages:
      - consul
      - nomad
      - podman
      - ceph-common
      - nomad-driver-podman
    tracked_services:
      - consul-server
      - consul-agent
      - consul-agent-root
      - nomad-server
      - nomad-agent
      - nomad-agent-root
      - node-exporter

  tasks:
    # -----------------------------------------------------------------------
    # Per-host: hardware info (collected via /proc to avoid LVM scan hangs)
    # -----------------------------------------------------------------------
    - name: Get total RAM in MB
      ansible.builtin.shell: awk '/MemTotal/ {printf "%d", $2/1024}' /proc/meminfo
      register: memtotal_result
      changed_when: false

    - name: Get vCPU count
      ansible.builtin.shell: nproc
      register: vcpus_result
      changed_when: false

    - name: Get uptime in seconds
      ansible.builtin.shell: awk '{printf "%d", $1}' /proc/uptime
      register: uptime_result
      changed_when: false

    # -----------------------------------------------------------------------
    # Per-host: packages
    # -----------------------------------------------------------------------
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Build package versions fact
      ansible.builtin.set_fact:
        pkg_versions: "{{ pkg_versions | default({}) | combine({item: version}) }}"
      vars:
        version: >-
          {{
            (ansible_facts.packages[item] | first).version
            if (ansible_facts.packages is defined
                and item in ansible_facts.packages
                and ansible_facts.packages[item] | length > 0)
            else 'not installed'
          }}
      loop: "{{ tracked_packages }}"

    # -----------------------------------------------------------------------
    # Per-host: services
    # -----------------------------------------------------------------------
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Build service states fact
      ansible.builtin.set_fact:
        svc_states: "{{ svc_states | default({}) | combine({item: state}) }}"
      vars:
        # service_facts keys may be 'consul-server' or 'consul-server.service'
        svc_key_unit: "{{ item }}.service"
        svc_entry: >-
          {{
            ansible_facts.services[svc_key_unit]
            if svc_key_unit in (ansible_facts.services | default({}))
            else (ansible_facts.services[item] | default({}))
            if item in (ansible_facts.services | default({}))
            else {}
          }}
        state: "{{ svc_entry.state | default('not found') }}"
      loop: "{{ tracked_services }}"

    # -----------------------------------------------------------------------
    # Per-host: assemble host_info fact
    # -----------------------------------------------------------------------
    - name: Assemble host_info fact
      ansible.builtin.set_fact:
        host_info:
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_distribution_release }})"
          kernel: "{{ ansible_kernel }}"
          ram_mb: "{{ memtotal_result.stdout }}"
          vcpus: "{{ vcpus_result.stdout }}"
          uptime_seconds: "{{ uptime_result.stdout }}"
          ip: "{{ ansible_default_ipv4.address | default(ansible_host) }}"
          packages: "{{ pkg_versions }}"
          services: "{{ svc_states }}"

    # -----------------------------------------------------------------------
    # Cluster-level: run once on the first server only
    # -----------------------------------------------------------------------

    # --- Consul ---
    - name: Query Consul agent self
      ansible.builtin.uri:
        url: "{{ consul_url }}/v1/agent/self"
        return_content: true
      register: consul_self_raw
      changed_when: false
      failed_when: false
      when: inventory_hostname == cluster_host

    - name: Query Consul agent members
      ansible.builtin.uri:
        url: "{{ consul_url }}/v1/agent/members"
        return_content: true
      register: consul_members_raw
      changed_when: false
      failed_when: false
      when: inventory_hostname == cluster_host

    # --- Nomad ---
    - name: Query Nomad agent self
      ansible.builtin.uri:
        url: "{{ nomad_url }}/v1/agent/self"
        return_content: true
      register: nomad_self_raw
      changed_when: false
      failed_when: false
      when: inventory_hostname == cluster_host

    - name: Query Nomad agent members
      ansible.builtin.uri:
        url: "{{ nomad_url }}/v1/agent/members"
        return_content: true
      register: nomad_members_raw
      changed_when: false
      failed_when: false
      when: inventory_hostname == cluster_host

    # --- Ceph ---
    - name: Query Ceph status (JSON)
      ansible.builtin.command: ceph status --format json
      register: ceph_status_raw
      changed_when: false
      failed_when: false
      when: inventory_hostname == cluster_host

    - name: Query Ceph version
      ansible.builtin.command: ceph -v
      register: ceph_version_raw
      changed_when: false
      failed_when: false
      when: inventory_hostname == cluster_host

    # --- Ceph pools ---
    - name: Query Ceph pool list
      ansible.builtin.command: ceph osd pool ls --format json
      register: ceph_pools_raw
      changed_when: false
      failed_when: false
      when: inventory_hostname == cluster_host

    # --- Nomad jobs ---
    - name: Query Nomad job list
      ansible.builtin.uri:
        url: "{{ nomad_url }}/v1/jobs"
        return_content: true
      register: nomad_jobs_raw
      changed_when: false
      failed_when: false
      when: inventory_hostname == cluster_host

    - name: Query Nomad job specs (for image info)
      ansible.builtin.uri:
        url: "{{ nomad_url }}/v1/job/{{ item.ID }}"
        return_content: true
      register: nomad_job_specs_raw
      changed_when: false
      loop: "{{ nomad_jobs_raw.json | default([]) }}"
      loop_control:
        label: "{{ item.ID }}"
      when:
        - inventory_hostname == cluster_host
        - nomad_jobs_raw is defined
        - "'/' not in item.ID"

    - name: Query allocations for each job (for node placement)
      ansible.builtin.uri:
        url: "{{ nomad_url }}/v1/job/{{ item.ID }}/allocations"
        return_content: true
      register: nomad_allocs_raw
      changed_when: false
      loop: "{{ nomad_jobs_raw.json | default([]) }}"
      loop_control:
        label: "{{ item.ID }}"
      when:
        - inventory_hostname == cluster_host
        - nomad_jobs_raw is defined
        - "'/' not in item.ID"

    # --- Parse and assemble cluster-level facts ---
    - name: Parse Ceph status JSON
      ansible.builtin.set_fact:
        ceph_status_parsed: "{{ ceph_status_raw.stdout | from_json }}"
      when:
        - inventory_hostname == cluster_host
        - ceph_status_raw is defined
        - ceph_status_raw.rc | default(1) == 0

    - name: Parse Ceph version string
      ansible.builtin.set_fact:
        # e.g. "ceph version 17.2.7 (abc123) quincy (stable)"
        ceph_version_parsed:
          version: >-
            {{
              ceph_version_raw.stdout
              | regex_search('ceph version ([\d\.]+)', '\1')
              | first | default('unknown')
            }}
          codename: >-
            {{
              ceph_version_raw.stdout
              | regex_search('\)\s+(\w+)\s+\(', '\1')
              | first | default('unknown')
            }}
      when:
        - inventory_hostname == cluster_host
        - ceph_version_raw is defined
        - ceph_version_raw.rc | default(1) == 0

    - name: Parse Ceph pool list
      ansible.builtin.set_fact:
        ceph_pools_parsed: "{{ ceph_pools_raw.stdout | default('[]') | from_json }}"
      when:
        - inventory_hostname == cluster_host
        - ceph_pools_raw is defined
        - ceph_pools_raw.rc | default(1) == 0

    - name: Build live_jobs dict
      ansible.builtin.set_fact:
        live_jobs: >-
          {{
            live_jobs | default({}) | combine({
              job_id: {
                'status': job_status,
                'type': job_type,
                'image_live': job_image,
                'node': job_node
              }
            })
          }}
      vars:
        job_id: "{{ item.item.ID }}"
        job_status: "{{ item.item.Status }}"
        job_type: "{{ item.item.Type }}"
        job_driver: >-
          {{
            item.json.TaskGroups[0].Tasks[0].Driver
            if (item.json is defined
                and item.json.TaskGroups is defined
                and item.json.TaskGroups | length > 0
                and item.json.TaskGroups[0].Tasks is defined
                and item.json.TaskGroups[0].Tasks | length > 0
                and item.json.TaskGroups[0].Tasks[0].Driver is defined)
            else 'unknown'
          }}
        job_image: >-
          {{
            item.json.TaskGroups[0].Tasks[0].Config.image
            if (item.json is defined
                and item.json.TaskGroups is defined
                and item.json.TaskGroups | length > 0
                and item.json.TaskGroups[0].Tasks is defined
                and item.json.TaskGroups[0].Tasks | length > 0
                and item.json.TaskGroups[0].Tasks[0].Config is defined
                and item.json.TaskGroups[0].Tasks[0].Config.image is defined)
            else ('n/a (' + job_driver + ')')
          }}
        job_allocs: >-
          {{
            nomad_allocs_raw.results
            | selectattr('item.ID', 'equalto', job_id)
            | map(attribute='json')
            | first
            | default([])
          }}
        running_allocs: >-
          {{
            job_allocs | selectattr('ClientStatus', 'equalto', 'running') | list
          }}
        job_node: >-
          {{
            (running_allocs | first).NodeName
            if running_allocs | length > 0
            else 'none'
          }}
      loop: "{{ nomad_job_specs_raw.results | default([]) | selectattr('json', 'defined') | list }}"
      loop_control:
        label: "{{ item.item.ID }}"
      when:
        - inventory_hostname == cluster_host
        - nomad_job_specs_raw is defined

    - name: Assemble cluster_facts
      ansible.builtin.set_fact:
        cluster_facts:
          consul:
            version: "{{ consul_self_raw.json.Config.Version | default('unknown') }}"
            datacenter: "{{ consul_self_raw.json.Config.Datacenter | default('unknown') }}"
            leader_addr: "{{ consul_self_raw.json.Stats.consul.leader_addr | default('unknown') }}"
            members: >-
              {{
                consul_members_raw.json
                | default([])
                | map(attribute='Name')
                | list
              }}
          nomad:
            version: "{{ nomad_self_raw.json.member.Tags.build | default('unknown') }}"
            region: "{{ nomad_self_raw.json.config.Region | default('unknown') }}"
            leader_addr: "{{ nomad_self_raw.json.stats.nomad.leader_addr | default('unknown') }}"
            members: >-
              {{
                nomad_members_raw.json.Members
                | default([])
                | map(attribute='Name')
                | list
              }}
          ceph:
            health: "{{ ceph_status_parsed.health.status | default('unknown') }}"
            osds: "{{ ceph_status_parsed.osdmap.num_osds | default(0) | int }}"
            version: "{{ ceph_version_parsed.version | default('unknown') }}"
            codename: "{{ ceph_version_parsed.codename | default('unknown') }}"
            pools: "{{ ceph_pools_parsed | default([]) }}"
      when: inventory_hostname == cluster_host

# ---------------------------------------------------------------------------
# Play 2: Assemble state and generate output (runs on localhost/controller)
# ---------------------------------------------------------------------------
- name: Assemble state and generate output
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    first_server: "{{ groups['servers'][0] }}"
    state_dir: "{{ playbook_dir }}/../docs/state"
    terraform_dir: "{{ playbook_dir }}/../terraform"

  tasks:
    - name: Ensure docs/state directory exists
      ansible.builtin.file:
        path: "{{ state_dir }}"
        state: directory
        mode: "0755"

    # -----------------------------------------------------------------------
    # Parse intended images from terraform variables.tf files
    # -----------------------------------------------------------------------
    - name: Find all terraform variables.tf files
      ansible.builtin.find:
        paths: "{{ terraform_dir }}"
        patterns: "variables.tf"
        recurse: true
        depth: 2
      register: tf_vars_files

    - name: Slurp terraform variables.tf files
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: tf_vars_slurped
      loop: "{{ tf_vars_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Build intended_images dict from terraform variables
      ansible.builtin.set_fact:
        intended_images: "{{ intended_images | default({}) | combine({service_name: images_dict}) }}"
      vars:
        tf_content: "{{ item.content | b64decode }}"
        service_name: "{{ item.source | dirname | basename }}"
        # Extract all variable names matching *image* and their defaults
        var_names: >-
          {{ tf_content | regex_findall('variable\s+"(\w*image\w*)"\s*\{', multiline=True) }}
        var_defaults: >-
          {{ tf_content | regex_findall('variable\s+"\w*image\w*"\s*\{[^}]*default\s*=\s*"([^"]+)"', multiline=True) }}
        # Build a dict of {var_name: default_value} for all image vars in this module
        images_dict: >-
          {{
            dict(var_names | zip(var_defaults))
            if var_names | length == var_defaults | length
            else dict(var_names | zip(var_defaults[:var_names | length]))
          }}
      loop: "{{ tf_vars_slurped.results }}"
      loop_control:
        label: "{{ item.source | dirname | basename }}"
      when: >-
        (item.content | b64decode)
        | regex_search('variable\s+"\w*image\w*"\s*\{', multiline=True)

    # -----------------------------------------------------------------------
    # Assemble complete lab_state fact
    # -----------------------------------------------------------------------
    - name: Assemble lab_state fact
      ansible.builtin.set_fact:
        lab_state:
          captured_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          cluster: "{{ hostvars[first_server].cluster_facts | default({}) }}"
          hosts: >-
            {{
              dict(
                groups['servers']
                | zip(groups['servers'] | map('extract', hostvars, 'host_info'))
              )
            }}
          jobs: "{{ hostvars[first_server].live_jobs | default({}) }}"
          intended_images: "{{ intended_images | default({}) }}"

    # -----------------------------------------------------------------------
    # Write JSON output
    # -----------------------------------------------------------------------
    - name: Write lab-state.json
      ansible.builtin.copy:
        content: "{{ lab_state | to_nice_json }}"
        dest: "{{ state_dir }}/lab-state.json"
        mode: "0644"

    # -----------------------------------------------------------------------
    # Generate markdown via Python script
    # -----------------------------------------------------------------------
    - name: Generate markdown from lab-state.json
      ansible.builtin.command:
        cmd: >-
          python3 scripts/state-to-markdown.py
          {{ state_dir }}/lab-state.json
          {{ state_dir }}/lab-state.md
        chdir: "{{ playbook_dir }}/.."
      changed_when: true

    # -----------------------------------------------------------------------
    # Summary
    # -----------------------------------------------------------------------
    - name: Display capture summary
      ansible.builtin.debug:
        msg: |
          === LAB STATE CAPTURE COMPLETE ===
          Captured at:     {{ lab_state.captured_at }}
          Hosts captured:  {{ groups['servers'] | join(', ') }}
          Jobs tracked:    {{ lab_state.jobs | length }}
          Intended images: {{ lab_state.intended_images | length }} services
          Output:          {{ state_dir }}/lab-state.json
          Markdown:        {{ state_dir }}/lab-state.md
          ===================================
