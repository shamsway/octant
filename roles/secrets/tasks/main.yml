---
# Secrets management - supports 1Password+direnv or plain .env files

- name: Check if 1Password CLI is available
  ansible.builtin.command: which op
  register: op_check
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false

- name: Check for .env file
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/.env"
  register: env_file_stat
  delegate_to: localhost
  become: false

- name: Check for .env.template file
  ansible.builtin.stat:
    path: "{{ secrets_env_template }}"
  register: env_template_stat
  delegate_to: localhost
  become: false

- name: Render secrets from 1Password
  ansible.builtin.shell: op inject -i {{ secrets_env_template }} -o {{ playbook_dir }}/.env
  delegate_to: localhost
  become: false
  when:
    - op_check.rc == 0
    - env_template_stat.stat.exists
    - not env_file_stat.stat.exists or secrets_provider == '1password'
  changed_when: true

- name: Verify .env file exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/.env"
  register: final_env_check
  delegate_to: localhost
  become: false

- name: Warn if no secrets file found
  ansible.builtin.debug:
    msg: "WARNING: No .env file found. Services requiring secrets may fail. Create .env or configure 1Password."
  when: not final_env_check.stat.exists

- name: Deploy .env to target host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/.env"
    dest: "{{ secrets_env_file }}"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: '0600'
  when: final_env_check.stat.exists
